<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-powered technical interview assistant for Full Stack Developer positions" />
    <meta name="keywords" content="interview, AI, technical interview, full stack, developer, React, Node.js" />
    <meta name="author" content="AI Interview Assistant" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="AI Interview Assistant" />
    <meta property="og:description" content="Conduct AI-powered technical interviews with automated scoring and feedback" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Interview Assistant" />
    <meta name="twitter:description" content="Conduct AI-powered technical interviews with automated scoring and feedback" />
    
    <!-- Preconnect to external domains for better performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#1890ff" />
    <meta name="msapplication-TileColor" content="#1890ff" />
    
    <title>AI Interview Assistant - Technical Interview Platform</title>
    
    <!-- Critical CSS -->
    <style>
      /* Loading screen styles */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 10px;
      }
      
      .loading-subtext {
        font-size: 14px;
        opacity: 0.8;
      }
      
      /* Hide loading screen when app loads */
      .app-loaded #loading {
        display: none;
      }
      
      /* Prevent flash of unstyled content */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
      }
      
      .app-loaded #root {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">AI Interview Assistant</div>
      <div class="loading-subtext">Loading application...</div>
    </div>
    
    <!-- React App Root -->
    <div id="root"></div>
    
    <!-- Error Fallback -->
    <noscript>
      <div style="
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
        background: #f5f5f5;
      ">
        <h1 style="color: #1890ff;">AI Interview Assistant</h1>
        <p style="color: #666; max-width: 500px; line-height: 1.5;">
          JavaScript is required to run this application. 
          Please enable JavaScript in your browser and refresh the page.
        </p>
        <button onclick="window.location.reload()" style="
          background: #1890ff;
          color: white;
          border: none;
          padding: 12px 24px;
          border-radius: 6px;
          font-size: 16px;
          cursor: pointer;
          margin-top: 20px;
        ">
          Refresh Page
        </button>
      </div>
    </noscript>
    
    <!-- Service Worker Registration -->
    <script>
      // Remove loading screen once app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.body.classList.add('app-loaded');
        }, 500);
      });
      
      // Register service worker for offline functionality (if available)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
      
      // Error handling for uncaught errors
      window.addEventListener('error', (event) => {
        console.error('Global error:', event.error);
        // Could send to error reporting service here
      });
      
      // Error handling for unhandled promise rejections
      window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled promise rejection:', event.reason);
        // Could send to error reporting service here
      });
    </script>
    
    <!-- Main Application Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
